    // --- DETERMINISTIC MATCHING ENGINE ---
    function runMatching(req, providersList) {
      const tokens = (req.title + " " + req.description).toLowerCase().split(/\s+/).filter(w => w.length > 2);
      
      const scored = providersList.map(p => {
        let score = 0;
        const reasons = [];

        if (p.categories.includes(req.category)) {
          score += 40;
          reasons.push(`Direct category match in ${req.category.replace(/_/g, ' ')}`);
        }

        const pText = (p.name + " " + p.description + " " + p.assistance_types.join(" ")).toLowerCase();
        let kwHits = tokens.filter(t => pText.includes(t)).length;
        if (kwHits > 0) {
          score += Math.min(25, kwHits * 6);
          reasons.push("Matches relevant keywords in your request");
        }

        if (req.pin_code && p.pin_code === req.pin_code) {
          score += 20;
          reasons.push(`Direct match in your PIN code (${p.pin_code})`);
        } else if (p.city.toLowerCase() === req.city.toLowerCase()) {
          score += 16;
          reasons.push(`Operates locally in ${p.city}`);
        } else {
          score += 5;
          reasons.push(`Regional support capacity`);
        }

        if (p.verification_status === "verified") {
          score += 10;
          reasons.push("Audited and verified organization");
        }

        if (p.availability_status === "available") {
          score += 5;
          reasons.push("Currently accepting intakes");
        }

        return {
          provider: p,
          match_score: Math.min(100, score),
          rationale: reasons
        };
      });

      scored.sort((a,b) => b.match_score - a.match_score);
      return scored.slice(0, 3).map((m, i) => ({ ...m, rank: i + 1, is_best_match: i === 0 }));
    }

              update_description: `Case initialized in ${form.city}. Smart matching completed.`,

                    <h3 className="text-lg font-bold text-gray-900">{contactModalProvider.name}</h3>
                  </div>
                  <button onClick={() => setContactModalProvider(null)} className="text-gray-400 hover:text-gray-700">✕</button>
                </div>

                <div className="bg-gray-50 p-3 rounded-xl border border-gray-200 text-xs">
                  <div>Phone: <strong>{contactModalProvider.phone}</strong></div>
                  <a
                    href={`tel:${contactModalProvider.phone.replace(/\s+/g, '')}`}
                    className="mt-2 inline-block bg-[#16a34a] text-white px-4 py-1.5 rounded-lg text-xs font-bold"
                  >
                    📞 Open Phone Dialer
                  </a>
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-800 mb-2">What happened on the call?</label>
                  <div className="space-y-1.5 text-xs">
                    {[
                      { id: 'connected', label: 'Connected / Spoke with staff' },
                      { id: 'help_promised', label: 'Help Promised (Pending delivery)' },
                      { id: 'provider_cannot_help', label: 'Cannot Help (Activate Smart Fallback)' },
                      { id: 'no_answer', label: 'No Answer / Line Busy' }
                    ].map(opt => (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => handleSaveCallOutcome(contactModalProvider, opt.id, "Logged via web UI.")}
                        className="w-full text-left p-2.5 rounded-xl border border-gray-200 hover:bg-orange-50 hover:border-[#ea580c] transition-colors"
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#0f172a] text-white py-10 border-t border-gray-800 mt-20">
            <div className="max-w-7xl mx-auto px-4 text-center space-y-3 text-xs text-gray-400">
              <div className="font-bold text-white text-base">MADAD Connect</div>
              <p>You explain your problem. MADAD finds the way forward.</p>
              <p className="text-[11px] text-gray-500">"Finding a provider is not success. Resolving the person's problem is success."</p>
              <div className="pt-4 text-[10px]">© 2026 MADAD Connect. Built with dignity and purpose.</div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
